[project]
name = "reverb-data-challenge"
version = "0.1.0"
description = "Reverb Data Engineering Coding Extension"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["test"]
